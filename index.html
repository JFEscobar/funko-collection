<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>The Shelf — Funko Pop Collection</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Source+Sans+3:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "paper-white": "#FDFCFB",
              "tertiary-fixed": "#7af4ff",
              "surface-container-high": "#e7e7f1",
              secondary: "#006a63",
              "inverse-surface": "#2e3038",
              "on-primary-container": "#6c2000",
              "primary-fixed": "#ffdbcf",
              "on-primary-fixed": "#380c00",
              "inverse-primary": "#ffb59c",
              "surface-dim": "#d9d9e3",
              "primary-fixed-dim": "#ffb59c",
              "on-tertiary-fixed-variant": "#004f54",
              "teal-soft": "#4DB6AC",
              primary: "#a43c12",
              "surface-container": "#ededf7",
              "inverse-on-surface": "#f0f0fa",
              "on-surface": "#191b22",
              "on-error-container": "#93000a",
              error: "#ba1a1a",
              "tertiary-container": "#00b5c0",
              "surface-container-highest": "#e2e2ec",
              background: "#faf8ff",
              "error-container": "#ffdad6",
              tertiary: "#006970",
              "coral-vibrant": "#FF7F50",
              "surface-container-low": "#f3f3fd",
              "on-secondary-fixed": "#00201d",
              "navy-deep": "#1A1C23",
              "on-tertiary-container": "#004145",
              "secondary-container": "#8bf1e6",
              "on-secondary": "#ffffff",
              "on-background": "#191b22",
              "on-primary-fixed-variant": "#822800",
              "on-tertiary": "#ffffff",
              "on-secondary-fixed-variant": "#00504a",
              "outline-variant": "#dec0b6",
              "on-primary": "#ffffff",
              "secondary-fixed-dim": "#71d7cd",
              "surface-tint": "#a43c12",
              "surface-container-lowest": "#ffffff",
              "on-tertiary-fixed": "#002022",
              surface: "#faf8ff",
              "on-surface-variant": "#57423b",
              "secondary-fixed": "#8ef4e9",
              outline: "#8b7169",
              "on-secondary-container": "#006f67",
              "surface-variant": "#e2e2ec",
              "surface-bright": "#faf8ff",
              "tertiary-fixed-dim": "#4dd9e4",
              "primary-container": "#ff7f50",
              "on-error": "#ffffff",
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "0.75rem",
              xl: "1rem",
              full: "9999px",
            },
            fontFamily: {
              body: ['"Source Sans 3"', "sans-serif"],
              headline: ["Plus Jakarta Sans", "sans-serif"],
              mono: ['"IBM Plex Mono"', "monospace"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="selection:bg-primary-fixed selection:text-on-primary-fixed">
    <header
      class="bg-white border-b border-surface-container-high sticky top-0 z-40"
    >
      <div
        class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between flex-wrap gap-4"
      >
        <a class="flex items-center gap-3 group" href="#/">
          <div
            class="w-10 h-10 bg-coral-vibrant rounded-xl flex items-center justify-center text-white brand-font text-xl transition-transform group-hover:scale-110"
          >
            K
          </div>
          <div class="flex flex-col">
            <span class="brand-font text-xl text-navy-deep leading-none"
              >Kevin's funko collection</span
            >
            <span
              class="text-xs font-mono text-on-surface-variant uppercase tracking-widest mt-1"
            ></span>
          </div>
        </a>
        <p
          class="hidden md:block text-sm text-on-surface-variant font-body italic"
        >
          "Pick what you like. Copy the list. Easy."
        </p>
      </div>
    </header>

    <main class="view max-w-6xl mx-auto px-6 py-12" id="view"></main>

    <!-- Selection drawer: a corner panel, same behavior on mobile and desktop.
     Collapsed = a round icon+count badge, bottom-right. Tapping it grows the
     panel toward the upper-left (the anchor corner never moves). -->
    <div
      class="fixed z-50 bottom-5 right-5 sm:bottom-6 sm:right-6 pointer-events-none"
      hidden=""
      id="drawer"
    >
      <div
        class="bg-navy-deep text-white shadow-2xl pointer-events-auto"
        id="drawer-container"
      >
        <button
          aria-expanded="false"
          class="drawer-toggle-btn"
          id="drawer-toggle"
          type="button"
        >
          <span class="material-symbols-outlined drawer-fab-icon"
            >shopping_bag</span
          >
          <div class="drawer-count-badge" id="drawer-count-wrap">
            <span id="drawer-count">0</span>
          </div>
          <span
            class="drawer-label font-headline font-semibold text-sm uppercase tracking-wider flex-1 text-left"
            >Items selected</span
          >
          <span
            class="drawer-label font-mono text-lg font-bold"
            id="drawer-total"
            >$0.00</span
          >
          <span
            class="drawer-label drawer__chevron material-symbols-outlined transition-transform duration-300"
            >keyboard_arrow_up</span
          >
        </button>
        <div id="drawer-body">
          <div class="px-6 pb-6">
            <div
              class="h-[2px] w-full border-t border-dashed border-white/20 my-4"
            ></div>
            <ul
              class="flex flex-col gap-3 max-h-60 overflow-y-auto mb-6 pr-2"
              id="drawer-list"
            ></ul>
            <div class="flex items-center gap-4">
              <button
                class="flex-1 bg-coral-vibrant hover:bg-[#ff8f66] text-white font-headline font-bold py-4 px-6 rounded-xl transition-all flex items-center justify-center gap-2"
                id="send-list-btn"
                type="button"
              >
                <span class="material-symbols-outlined">content_copy</span>
                Copy List to Clipboard
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      aria-live="polite"
      class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-navy-deep text-white px-6 py-3 rounded-full text-sm font-medium shadow-xl opacity-0 translate-y-4 pointer-events-none transition-all duration-300 z-[60]"
      id="toast"
      role="status"
    ></div>

    <!-- Lightbox: tap the detail photo to open this full-screen view -->
    <div
      aria-modal="true"
      class="fixed inset-0 z-[70] hidden items-center justify-center bg-black/90 p-4"
      id="lightbox"
      role="dialog"
    >
      <button
        aria-label="Close"
        class="absolute top-4 right-4 sm:top-6 sm:right-6 w-11 h-11 flex items-center justify-center rounded-full bg-white/10 text-white hover:bg-white/20 transition-colors"
        id="lightbox-close"
        type="button"
      >
        <span class="material-symbols-outlined">close</span>
      </button>
      <button
        aria-label="Previous photo"
        class="absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 w-11 h-11 flex items-center justify-center rounded-full bg-white/10 text-white hover:bg-white/20 transition-colors"
        id="lightbox-prev"
        type="button"
      >
        <span class="material-symbols-outlined">chevron_left</span>
      </button>
      <img
        alt=""
        class="max-w-full max-h-full object-contain rounded-lg"
        id="lightbox-img"
        src=""
      />
      <button
        aria-label="Next photo"
        class="absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 w-11 h-11 flex items-center justify-center rounded-full bg-white/10 text-white hover:bg-white/20 transition-colors"
        id="lightbox-next"
        type="button"
      >
        <span class="material-symbols-outlined">chevron_right</span>
      </button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
